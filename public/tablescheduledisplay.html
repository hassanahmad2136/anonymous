<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Schedule Display</title>
    <style>
        @font-face {
            font-family: 'BigNoodle';
            src: url('Assets/Font/big_noodle_titling.ttf') format('truetype');
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            min-height: 100vh;
            overflow: hidden;
        }

        .table-container {
            width: 920px;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 20px 60px rgba(0,0,0,0.4),
                0 0 40px rgba(168,85,247,0.05);
            animation: containerIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            position: relative;
        }

        /* Subtle top glow line */
        .table-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent, rgba(168,85,247,0.6)), transparent);
            z-index: 10;
        }

        .table-title {
            font-family: 'BigNoodle', sans-serif;
            font-size: 2rem;
            text-align: center;
            padding: 16px 20px;
            letter-spacing: 4px;
            color: var(--text-color, #ffffff);
            background: linear-gradient(180deg, var(--header-color, rgba(168,85,247,0.5)), rgba(0,0,0,0.2));
            border-bottom: 1px solid rgba(255,255,255,0.06);
            text-shadow: 0 0 20px rgba(168,85,247,0.3);
            position: relative;
            overflow: hidden;
        }

        /* Shimmer sweep on title */
        .table-title::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            animation: shimmer 4s ease-in-out infinite;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            font-family: 'BigNoodle', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 2px;
            padding: 10px 15px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        tbody tr {
            transition: background 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
            position: relative;
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.06) !important;
            box-shadow: inset 0 0 30px rgba(168,85,247,0.04);
        }

        /* Accent bar on left of hovered row */
        tbody tr::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: var(--accent, #a855f7);
            opacity: 0;
            transition: opacity 0.3s;
        }

        tbody tr:hover::before {
            opacity: 1;
        }

        tbody td {
            padding: 16px 15px;
            text-align: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color, rgba(255,255,255,0.9));
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .team-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .team-cell.right {
            flex-direction: row-reverse;
        }

        .team-logo {
            width: 38px;
            height: 38px;
            object-fit: contain;
            border-radius: 6px;
            background: rgba(255,255,255,0.04);
            padding: 3px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        tbody tr:hover .team-logo {
            transform: scale(1.12);
            box-shadow: 0 0 12px rgba(168,85,247,0.2);
        }

        .team-name {
            font-family: 'BigNoodle', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        .score-cell {
            font-family: 'BigNoodle', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-shadow: 0 0 8px rgba(255,255,255,0.1);
        }

        .match-num {
            font-family: 'BigNoodle', sans-serif;
            font-size: 1.1rem;
            opacity: 0.35;
        }

        .time-cell {
            font-size: 0.85rem;
            opacity: 0.55;
            letter-spacing: 0.5px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .status-upcoming {
            background: rgba(168,85,247,0.1);
            color: rgba(192,132,252,0.8);
            border: 1px solid rgba(168,85,247,0.15);
        }

        .status-live {
            background: rgba(239,68,68,0.12);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
            animation: livePulse 2s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(239,68,68,0.1);
        }

        .status-finished {
            background: rgba(16,185,129,0.1);
            color: rgba(110,231,183,0.8);
            border: 1px solid rgba(16,185,129,0.15);
        }

        /* Animations */
        @keyframes containerIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes rowSlideIn {
            from {
                opacity: 0;
                transform: translateX(-15px);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
                filter: blur(0);
            }
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        @keyframes shimmer {
            0% { left: -100%; }
            50%, 100% { left: 200%; }
        }

        /* Live row subtle side glow */
        .row-live {
            box-shadow: inset 3px 0 8px rgba(239,68,68,0.1);
        }
    </style>
</head>
<body>
    <div class="table-container" id="tableContainer">
        <div class="table-title" id="tableTitle">MATCH SCHEDULE</div>
        <table>
            <thead>
                <tr>
                    <th style="width:5%">#</th>
                    <th style="width:26%">Team</th>
                    <th style="width:13%">Score</th>
                    <th style="width:26%">Team</th>
                    <th style="width:15%">Time</th>
                    <th style="width:15%">Status</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <script>
        let serverIP = 'localhost';
        const serverPort = 3000;

        async function initIP() {
            try {
                const res = await fetch('/serverip.txt');
                const ip = (await res.text()).trim();
                if (ip) serverIP = ip;
            } catch(e) {}
            connectWS();
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function applyColors(colors) {
            const root = document.documentElement;
            const container = document.getElementById('tableContainer');
            if (colors.border) {
                root.style.setProperty('--accent', colors.border);
                container.style.borderColor = hexToRgba(colors.border, 0.15);
            }
            if (colors.text) root.style.setProperty('--text-color', colors.text);
            if (colors.header) root.style.setProperty('--header-color', hexToRgba(colors.header, 0.45));
        }

        function renderTable(data) {
            if (!data || !data.matches) return;

            if (data.title) {
                document.getElementById('tableTitle').textContent = data.title;
            }

            if (data.colors) {
                applyColors(data.colors);
            }

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.matches.forEach((match, index) => {
                const row = document.createElement('tr');
                row.style.animation = `rowSlideIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) ${index * 0.08}s forwards`;
                row.style.opacity = '0';

                if (match.status === 'live') row.classList.add('row-live');

                if (data.colors?.row && data.colors?.altRow) {
                    row.style.background = index % 2 === 0
                        ? hexToRgba(data.colors.row, 0.3)
                        : hexToRgba(data.colors.altRow, 0.3);
                } else {
                    row.style.background = index % 2 === 0
                        ? 'rgba(255,255,255,0.02)'
                        : 'rgba(255,255,255,0.04)';
                }

                const logo1 = match.logo1 || 'Assets/Other/transparent.png';
                const logo2 = match.logo2 || 'Assets/Other/transparent.png';

                row.innerHTML = `
                    <td class="match-num">${index + 1}</td>
                    <td>
                        <div class="team-cell">
                            <img src="${logo1}" class="team-logo">
                            <span class="team-name">${match.team1 || 'TBD'}</span>
                        </div>
                    </td>
                    <td class="score-cell">${match.score1 || '0'} - ${match.score2 || '0'}</td>
                    <td>
                        <div class="team-cell right">
                            <img src="${logo2}" class="team-logo">
                            <span class="team-name">${match.team2 || 'TBD'}</span>
                        </div>
                    </td>
                    <td class="time-cell">${match.time || '-'}</td>
                    <td><span class="status-badge status-${match.status || 'upcoming'}">${match.status || 'upcoming'}</span></td>
                `;

                tbody.appendChild(row);
            });

            if (data.colors?.bg) {
                document.getElementById('tableContainer').style.background = hexToRgba(data.colors.bg, 0.5);
            }
        }

        function connectWS() {
            const ws = new WebSocket(`ws://${location.host}`);

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'tableschedule_update') {
                        renderTable(msg.data);
                    }
                } catch(e) {}
            };

            ws.onclose = () => {
                setTimeout(connectWS, 3000);
            };
        }

        async function loadInitial() {
            try {
                const res = await fetch('/api/tableschedule');
                const data = await res.json();
                if (data && data.matches) renderTable(data);
            } catch(e) {}
        }

        initIP();
        loadInitial();
    </script>
</body>
</html>
